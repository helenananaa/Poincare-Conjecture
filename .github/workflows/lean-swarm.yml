name: Lean Swarm controller tests
on:
  push:
    paths: ["tools/lean_swarm/**", ".github/workflows/lean-swarm.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tools/lean_swarm -p 'test_*.py' -v
